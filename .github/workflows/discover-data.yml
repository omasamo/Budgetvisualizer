name: Discover official data
# Temporary: downloads the MF SR open data catalog and candidate files into the
# branch so their structure can be inspected. Replaced later by update-data.yml.
on:
  push:
    branches: ['claude/**']
    paths: ['pipeline/discover.sh', '.github/workflows/discover-data.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash pipeline/discover.sh
      - name: Commit downloaded files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/sk/_discovery
          git commit -m "data: download official files for inspection" || exit 0
          git push
